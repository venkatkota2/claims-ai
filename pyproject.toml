[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claims-ai"
version = "0.1.0"
description = "Claims operations analytics with delay-risk modelling and responsible-AI controls."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
claims-ai-demo = "claims_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
